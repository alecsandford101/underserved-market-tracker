name: Refresh market data

# Runs the free HN + Wikipedia (demand) + BLS QCEW (size & growth) fetch on a
# schedule and commits data.json back to the repo. GitHub Pages then serves the
# refreshed scores. Free on public repos; no API keys needed, so nothing secret
# is exposed.

on:
  schedule:
    - cron: '17 6 * * *'   # daily at ~06:17 UTC
  workflow_dispatch: {}     # allow manual "Run workflow" from the Actions tab

permissions:
  contents: write           # lets the job push the updated data.json

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch US live signals -> data.json
        run: node scripts/fetch-signals.mjs us > data.json

      - name: Fetch UK live signals -> data-uk.json
        run: node scripts/fetch-signals.mjs uk > data-uk.json

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json data-uk.json
          if git diff --cached --quiet; then
            echo "No data changes — nothing to commit."
          else
            git commit -m "chore: refresh live demand data [skip ci]"
            git push
          fi
